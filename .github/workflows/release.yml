name: Release

# Calcula la próxima versión siguiendo SemVer (según los commits feat:/fix:/
# breaking) y crea el tag vX.Y.Z. El workflow build.yml (en push de tag v*)
# se encarga de compilar la app y publicar la release con los adjuntos.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: 'Tipo de bump: major, minor o patch (vacío = automático)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main

      - name: Bump de versión (SemVer) y publicar
        env:
          BUMP_INPUT: ${{ github.event.inputs.bump }}
        run: |
          if [ -n "$BUMP_INPUT" ]; then
            ./scripts/bump-version.sh "--$BUMP_INPUT" --push
          else
            ./scripts/bump-version.sh --push
          fi
